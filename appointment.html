<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookConnect — Appointment</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  /* Calendar Card */
  .calendar-card {
    background: #fff;
    border: 1px solid #e8ecef;
    border-radius: 12px;
    overflow: hidden;
  }

  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid #e8ecef;
  }

  .cal-nav-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid #e8ecef;
    background: #fff;
    color: #5a6c7d;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .cal-nav-btn:hover {
    background: #f0f2f5;
  }

  .cal-month {
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #1a202c;
    min-width: 120px;
    text-align: center;
  }

  /* Timeline header - days */
  .timeline-wrapper {
    overflow-x: auto;
  }

  .timeline-wrapper::-webkit-scrollbar {
    height: 4px;
  }

  .timeline-wrapper::-webkit-scrollbar-thumb {
    background: #d0e6f5;
    border-radius: 2px;
  }

  .timeline-grid {
    min-width: 900px;
    display: grid;
    grid-template-columns: 60px repeat(11, 1fr);
  }

  .timeline-header {
    display: contents;
  }

  .timeline-header-cell {
    padding: 0.75rem 0.5rem;
    text-align: center;
    border-bottom: 1px solid #e8ecef;
    border-right: 1px solid #f5f7fa;
  }

  .timeline-header-cell:first-child {
    border-right: 1px solid #e8ecef;
  }

  .day-name {
    font-size: 11px;
    color: #8b95a1;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .day-num {
    font-size: 13px;
    font-weight: 600;
    color: #2d3748;
    margin-top: 2px;
  }

  .day-num.today {
    color: #1a73e8;
  }

  /* Timeline body - time rows */
  .timeline-body {
    display: contents;
  }

  .time-label {
    padding: 0 0.75rem;
    font-size: 11px;
    color: #8b95a1;
    text-align: right;
    border-right: 1px solid #e8ecef;
    height: 52px;
    display: flex;
    align-items: flex-start;
    padding-top: 6px;
  }

  .timeline-cell {
    height: 52px;
    border-bottom: 1px solid #f5f7fa;
    border-right: 1px solid #f5f7fa;
    position: relative;
  }

  .timeline-cell:hover {
    background: #f8fbff;
  }

  /* Empty state */
  .timeline-empty {
    grid-column: 2 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    color: #8b95a1;
    font-size: 13.5px;
    border-left: 1px solid #e8ecef;
  }

  /* Table styles from boxing */
  .class-table-card {
    background: #fff;
    border: 1px solid #e8ecef;
    border-radius: 12px;
    overflow: hidden;
  }

  .table-wrapper {
    overflow-x: auto;
  }

  .table-wrapper::-webkit-scrollbar {
    height: 6px;
  }

  .table-wrapper::-webkit-scrollbar-track {
    background: #f8f9fa;
  }

  .table-wrapper::-webkit-scrollbar-thumb {
    background: #d0e6f5;
    border-radius: 3px;
  }

  .table-wrapper::-webkit-scrollbar-thumb:hover {
    background: #b8d4eb;
  }

  .class-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
  }

  .class-table thead {
    background: #f8f9fa;
  }

  .class-table th {
    text-align: left;
    padding: 1rem 1.5rem;
    font-size: 12px;
    font-weight: 600;
    color: #8b95a1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #e8ecef;
  }

  .class-table td {
    padding: 1.25rem 1.5rem;
    font-size: 14px;
    color: #2d3748;
    border-bottom: 1px solid #f5f7fa;
  }

  .class-table tr:last-child td {
    border-bottom: none;
  }

  .class-table tbody tr:hover {
    background: #fafbfc;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 2rem;
    color: #8b95a1;
    font-size: 14px;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-top: 1px solid #f0f2f5;
  }

  .pagination-info {
    font-size: 13px;
    color: #718096;
  }

  .pagination-buttons {
    display: flex;
    gap: 0.5rem;
  }

  .pagination-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid #e8ecef;
    background: #fff;
    color: #5a6c7d;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .pagination-btn:hover:not(:disabled) {
    background: #f0f2f5;
    border-color: #d0d7de;
  }

  .pagination-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pagination-btn.active {
    background: #1a73e8;
    border-color: #1a73e8;
    color: white;
  }

  .table-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #f0f2f5;
  }

  .search-input {
    width: 220px;
    height: 36px;
    padding: 0 0.875rem;
    border: 1px solid #e8ecef;
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    color: #2d3748;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input::placeholder { color: #8b95a1; }
  .search-input:focus { border-color: #1a73e8; }
</style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <div id="app-sidebar" data-page="appointment"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div id="app-topbar" data-title="Appointment"></div>

      <div class="content-area">
        <!-- Toolbar -->
        <div class="page-toolbar">
          <div class="page-toolbar-left">
            <h1 class="page-title">Appointment</h1>
            <div class="tab-group">
              <button class="tab-btn active" onclick="switchTab(this, 'timeline')">Timeline</button>
              <button class="tab-btn" onclick="switchTab(this, 'list')">List</button>
              <button class="tab-btn" onclick="switchTab(this, 'reports')">Reports</button>
            </div>
          </div>
          <button id="btn-create-appointment" class="btn-create" onclick="showCreateAppointmentModal()">
            Create Appointment
          </button>
        </div>

        <!-- Timeline View -->
        <div id="view-timeline" class="calendar-card">
          <div class="calendar-nav">
            <button class="cal-nav-btn" onclick="changeMonth(-1)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <span class="cal-month" id="cal-month-label">May 2026</span>
            <button class="cal-nav-btn" onclick="changeMonth(1)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          </div>

          <div class="timeline-wrapper">
            <div class="timeline-grid" id="timeline-grid">
              <!-- Rendered by JS -->
            </div>
          </div>
        </div>

        <!-- List View (hidden) -->
        <div id="view-list" style="display:none">
          <div class="class-table-card">
            <div class="table-toolbar">
              <button class="btn-filter">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="4" y1="6" x2="20" y2="6"/>
                  <line x1="8" y1="12" x2="16" y2="12"/>
                  <line x1="11" y1="18" x2="13" y2="18"/>
                </svg>
                Filters
              </button>
              <input type="text" class="search-input" placeholder="Search appointment..." oninput="filterAppointments(this.value)">
            </div>
            <div class="table-wrapper">
              <table class="class-table">
                <thead>
                  <tr>
                    <th>No.</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="appointment-tbody">
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="pagination">
              <div class="pagination-info">Page 1 of 1</div>
              <div class="pagination-buttons">
                <button class="pagination-btn" disabled>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"/>
                  </svg>
                </button>
                <button class="pagination-btn active">1</button>
                <button class="pagination-btn" disabled>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Reports View (hidden) -->
        <div id="view-reports" style="display:none">
          <div class="content-card">
            <div class="filter-section">
              <div class="filter-title">Filters</div>
              <div class="filter-row">
                <div class="filter-field">
                  <label class="filter-label">Status</label>
                  <div class="select-wrap">
                    <select class="filter-select">
                      <option>All Status</option>
                      <option>Active</option>
                      <option>Cancelled</option>
                      <option>Completed</option>
                    </select>
                  </div>
                </div>
                <div class="filter-field">
                  <label class="filter-label">Tanggal Mulai</label>
                  <input type="date" class="filter-input" placeholder="Select Start Date">
                </div>
                <div class="filter-field">
                  <label class="filter-label">Tanggal Berakhir</label>
                  <input type="date" class="filter-input" placeholder="Select End Date">
                </div>
                <div class="filter-field">
                  <label class="filter-label">Class</label>
                  <div class="select-wrap">
                    <select class="filter-select">
                      <option>Select...</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="filter-row" style="margin-top:0.875rem">
                <div class="filter-field">
                  <label class="filter-label">Instructor</label>
                  <div class="select-wrap">
                    <select class="filter-select">
                      <option>All Instructors</option>
                    </select>
                  </div>
                </div>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:0.75rem;margin-top:1.25rem">
                <button class="btn-create" onclick="applyFilter()">
                  Apply Filter
                </button>
                <button class="btn-clear" onclick="clearFilter()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
                  </svg>
                  Clear Filter
                </button>
              </div>
            </div>
            <div style="text-align:center;color:#8b95a1;padding:2.5rem 0;font-size:13.5px;border-top:1px solid #e8ecef;margin-top:1.25rem">
              No reports found for the selected filter.
            </div>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="createAppointmentModal">
        <div class="modal-container">
          <div class="modal-header">
            <h2 class="modal-title">Create Appointment</h2>
            <button class="modal-close-btn" onclick="hideCreateAppointmentModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem">
              <div style="font-size:1rem;font-weight:600;color:#1a202c">Selected Schedule Details</div>
              <button class="btn-create" style="padding:0.85rem 1rem;min-width:auto;white-space:nowrap;">Change Schedule</button>
            </div>
            <div style="margin-bottom:1.5rem">
              <label class="form-label" style="display:block;margin-bottom:0.5rem;font-weight:600;color:#1a202c;">Select Schedule</label>
              <div style="display:flex;gap:0.75rem;align-items:center;margin-bottom:0.75rem;">
                <input type="text" class="search-input" value="No schedules available" readonly style="flex:1;cursor:not-allowed;" />
                <button class="btn-create" style="padding:0.85rem 1rem;min-width:auto;">Select</button>
              </div>
              <div style="color:#dc2626;font-size:0.95rem;margin-bottom:0.25rem;">No schedules available</div>
              <div style="color:#dc2626;font-size:0.95rem;">No schedules available for the selected period.</div>
            </div>
            <div>
              <div style="font-size:1rem;font-weight:600;color:#1a202c;margin-bottom:0.75rem;">Client</div>
              <label class="form-label" style="display:block;margin-bottom:0.5rem;font-weight:600;color:#1a202c;">Client Name</label>
              <div style="display:flex;gap:0.75rem;align-items:center;">
                <input type="text" class="form-input" placeholder="Client Name" style="flex:1;border:1px solid #dc2626;" />
                <button class="btn-create" style="width:52px;height:52px;padding:0;display:flex;align-items:center;justify-content:center;"> 
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                </button>
              </div>
              <div style="color:#dc2626;font-size:0.95rem;margin-top:0.5rem;">Client name is required.</div>
            </div>
          </div>
          <div class="modal-footer" style="justify-content:center;">
            <button class="btn-create" style="width:100%;max-width:420px;">Confirm Booking</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Lang toggle
    

    function filterAppointments(query) {
      const rows = document.querySelectorAll('#appointment-tbody tr');
      const q = query.toLowerCase();
      rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    // Tab switching
    function switchTab(btn, view) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['timeline', 'list', 'reports'].forEach(v => {
        document.getElementById('view-' + v).style.display = v === view ? '' : 'none';
      });
    }

    function showCreateAppointmentModal() {
      document.getElementById('createAppointmentModal').classList.add('show');
    }

    function hideCreateAppointmentModal() {
      document.getElementById('createAppointmentModal').classList.remove('show');
    }

    // Calendar state
    let currentYear = 2026;
    let currentMonth = 4; // 0-indexed, 4 = May

    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const hours = ['00:00','01:00','02:00','03:00','04:00','05:00','06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00'];

    function changeMonth(dir) {
      currentMonth += dir;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderTimeline();
    }

    function renderTimeline() {
      document.getElementById('cal-month-label').textContent = monthNames[currentMonth] + ' ' + currentYear;

      const today = new Date();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const visibleDays = 11;

      // Build days starting from 1
      const days = [];
      for (let d = 1; d <= Math.min(visibleDays, daysInMonth); d++) {
        const date = new Date(currentYear, currentMonth, d);
        days.push({ d, name: dayNames[date.getDay()] });
      }

      const grid = document.getElementById('timeline-grid');
      grid.innerHTML = '';

      // Header row
      const emptyHeader = document.createElement('div');
      emptyHeader.className = 'timeline-header-cell';
      grid.appendChild(emptyHeader);

      days.forEach(({ d, name }) => {
        const cell = document.createElement('div');
        cell.className = 'timeline-header-cell';
        const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
        cell.innerHTML = `<div class="day-name">${name}</div><div class="day-num${isToday ? ' today' : ''}">${d} ${monthNames[currentMonth].slice(0,3)}</div>`;
        grid.appendChild(cell);
      });

      // Time rows
      hours.forEach(h => {
        const timeCell = document.createElement('div');
        timeCell.className = 'time-label';
        timeCell.textContent = h;
        grid.appendChild(timeCell);

        days.forEach(() => {
          const cell = document.createElement('div');
          cell.className = 'timeline-cell';
          grid.appendChild(cell);
        });
      });
    }

    renderTimeline();
  </script>

  <!-- Components -->
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
</body>
</html>
