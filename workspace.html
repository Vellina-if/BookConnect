<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookConnect — Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  .class-table-card {
    background: #fff;
    border: 1px solid #e8ecef;
    border-radius: 12px;
    overflow: hidden;
  }

  .table-wrapper {
    overflow-x: auto;
  }

  .table-wrapper::-webkit-scrollbar {
    height: 6px;
  }

  .table-wrapper::-webkit-scrollbar-track {
    background: #f8f9fa;
  }

  .table-wrapper::-webkit-scrollbar-thumb {
    background: #d0e6f5;
    border-radius: 3px;
  }

  .table-wrapper::-webkit-scrollbar-thumb:hover {
    background: #b8d4eb;
  }

  .class-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
  }

  .class-table thead {
    background: #f8f9fa;
  }

  .class-table th {
    text-align: left;
    padding: 1rem 1.5rem;
    font-size: 12px;
    font-weight: 600;
    color: #8b95a1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #e8ecef;
  }

  .class-table td {
    padding: 1.25rem 1.5rem;
    font-size: 14px;
    color: #2d3748;
    border-bottom: 1px solid #f5f7fa;
  }

  .class-table tr:last-child td {
    border-bottom: none;
  }

  .class-table tbody tr:hover {
    background: #fafbfc;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 2rem;
    color: #8b95a1;
    font-size: 14px;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-top: 1px solid #f0f2f5;
  }

  .pagination-info {
    font-size: 13px;
    color: #718096;
  }

  .pagination-buttons {
    display: flex;
    gap: 0.5rem;
  }

  .pagination-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid #e8ecef;
    background: #fff;
    color: #5a6c7d;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .pagination-btn:hover:not(:disabled) {
    background: #f0f2f5;
    border-color: #d0d7de;
  }

  .pagination-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pagination-btn.active {
    background: #1a73e8;
    border-color: #1a73e8;
    color: white;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .status-active {
    background: #dcfce7;
    color: #16a34a;
  }

  .status-inactive {
    background: #fee2e2;
    color: #dc2626;
  }

  .status-pending {
    background: #fef3c7;
    color: #d97706;
  }
</style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <div id="app-sidebar" data-page="workspace"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div id="app-topbar" data-title="Workspace"></div>

      <div class="content-area">
        <!-- Toolbar -->
        <div class="page-toolbar">
          <div class="page-toolbar-left">
            <h1 class="page-title">Manage Workspace</h1>
          </div>
        
        </div>

        <!-- Table Card -->
        <div class="class-table-card">
          <div class="table-wrapper">
            <table class="class-table">
              <thead>
                <tr>
                  <th>Workspace Name</th>
                  <th>Class</th>
                  <th>Team</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>Ell - Work</strong></td>
                  <td>Premium</td>
                  <td>Development Team</td>
                  <td>Jakarta, Indonesia</td>
                  <td><span class="status-badge status-active">Active</span></td>
                  <td>
                    <button class="icon-btn" title="Edit">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                      </svg>
                    </button>
                    <button class="icon-btn" title="Delete">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                      </svg>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="pagination">
            <div class="pagination-info">Showing 1 of 1 workspace</div>
            <div class="pagination-buttons">
              <button class="pagination-btn" disabled>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 18 9 12 15 6"/>
                </svg>
              </button>
              <button class="pagination-btn active">1</button>
              <button class="pagination-btn" disabled>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Components -->
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
  <script>
    // Hubungkan tombol Add Workspace di halaman dengan modal sidebar
    document.addEventListener('DOMContentLoaded', function() {
      const addWorkspaceBtn = document.querySelector('.btn-create');
      const workspaceModal = document.getElementById('workspaceModal');

      if (addWorkspaceBtn && workspaceModal) {
        addWorkspaceBtn.addEventListener('click', function() {
          workspaceModal.classList.add('show');
        });
      }
    });
  </script>
</body>
</html>
