<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookConnect — Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  .settings-card {
    background: #fff;
    border: 1px solid #e8ecef;
    border-radius: 12px;
    padding: 3rem;
    max-width: 1000px;
  }

  .settings-header {
    margin-bottom: 2rem;
  }

  .settings-header h2 {
    font-size: 20px;
    font-weight: 600;
    color: #1a202c;
    margin: 0 0 0.5rem 0;
  }

  .settings-header p {
    font-size: 14px;
    color: #718096;
    margin: 0;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #8b95a1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
  }

  .form-input {
    width: 100%;
    height: 40px;
    padding: 1rem, 1rem;
    border: 1px solid #e8ecef;
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    color: #2d3748;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus {
    border-color: #1a73e8;
  }

  .form-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 2rem;
    justify-content: flex-end;
  }

  .btn-cancel {
    padding: 0.5rem 1rem;
    background: #5a6c7d;
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-cancel:hover {
    background: #4a5c6d;
  }

  .btn-save {
    padding: 0.5rem 1rem;
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-save:hover {
    background: #1557b0;
  }
</style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <div id="app-sidebar" data-page="settings"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div id="app-topbar" data-title="Settings"></div>

      <div class="content-area">
        <div class="settings-card">
          <div class="settings-header">
            <h2>Account Settings</h2>
            <p>Update your profile information</p>
          </div>

          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" value="Vellina Kusuma">
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" value="hiiragishinoayuu@gmail.com">
          </div>

          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-input" value="+62 812 6766 5398">
          </div>

          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-input" placeholder="Enter current password">
          </div>

          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-input" placeholder="Enter new password">
          </div>

          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-input" placeholder="Confirm new password">
          </div>

          <div class="form-actions">
            <button class="btn-cancel" onclick="window.location.href='dashboard.html'">Cancel</button>
            <button class="btn-save" onclick="alert('Profile saved!'); window.location.href='dashboard.html'">Save Changes</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Components -->
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
</body>
</html>
